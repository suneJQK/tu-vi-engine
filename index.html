<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tử Vi Đẩu Số Engine</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Streamlit Component Library JS -->
    <script src="https://unpkg.com/streamlit-component-lib@^1.4.0/dist/streamlit-component-lib.js"></script>
    <style>
        :root {
            --bg-color: #0e1117;
            --card-bg: #161922;
            --accent-color: #f6d365;
            --text-color: #ffffff;
            --text-muted: #a0aec0;
            --border-color: #2d3748;
            --input-bg: #1a202c;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        header h1 {
            color: var(--accent-color);
            font-size: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 10px;
            border-bottom: 2px solid var(--border-color);
            margin-bottom: 20px;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 12px 20px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            border-bottom: 3px solid transparent;
        }

        .tab-btn.active {
            color: var(--accent-color);
            border-bottom-color: var(--accent-color);
            font-weight: bold;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Layout Grid */
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .grid-container {
                grid-template-columns: 1fr;
            }
        }

        /* Form Components */
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
        }

        .card h2 {
            font-size: 1.2rem;
            color: var(--accent-color);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .form-control {
            width: 100%;
            padding: 10px 14px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: #fff;
            font-size: 0.95rem;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 80px;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: var(--accent-color);
            color: #000;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 1rem;
            transition: opacity 0.2s;
        }

        .btn-submit:hover {
            opacity: 0.9;
        }

        /* Results Display */
        .result-box {
            background-color: var(--input-bg);
            border-radius: 8px;
            padding: 15px;
            min-height: 300px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        /* Chat UI */
        .chat-container {
            display: flex;
            flex-direction: column;
            height: 500px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chat-bubble {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.95rem;
            line-height: 1.4;
        }

        .chat-bubble.user {
            align-self: flex-end;
            background-color: #2b6cb0;
            color: #fff;
        }

        .chat-bubble.bot {
            align-self: flex-start;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: #fff;
        }

        .chat-input-area {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        /* Book Cache UI */
        .metric-card {
            background-color: var(--input-bg);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: inline-block;
        }

        .book-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .book-list li {
            background-color: var(--input-bg);
            padding: 10px 14px;
            border-radius: 6px;
            border-left: 3px solid var(--accent-color);
        }
    </style>
</head>
<body>

    <header>
        <h1>☯️ Tử Vi Đẩu Số Engine</h1>
    </header>

    <!-- Navigation Tabs -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab(0)">⚙️ Luận Giải Lá Số</button>
        <button class="tab-btn" onclick="switchTab(1)">💬 Trò Chuyện AI</button>
        <button class="tab-btn" onclick="switchTab(2)">📚 Kho Dữ Liệu Sách</button>
    </div>

    <!-- TAB 1: LUẬN GIẢI LÁ SỐ -->
    <div class="tab-content active" id="tab-0">
        <div class="grid-container">
            <div class="card">
                <h2><i class="fa-solid fa-sliders"></i> Cấu Hình Luận Giải</h2>
                <form id="analysis-form">
                    <div class="form-group">
                        <label>📸 Tải ảnh lá số Tử Vi</label>
                        <input type="file" id="file-input" class="form-control" accept="image/*" required>
                    </div>
                    <div class="form-group">
                        <label>📅 Năm Tiểu Hạn</label>
                        <input type="number" id="year-input" class="form-control" value="2026" min="1950" max="2050">
                    </div>
                    <div class="form-group">
                        <label>📝 Ghi chú thêm</label>
                        <textarea id="note-input" class="form-control">Phân tích kỹ Cách Cục và Vận Hạn.</textarea>
                    </div>
                    <button type="submit" class="btn-submit" id="btn-analyze">🔮 BẮT ĐẦU LUẬN GIẢI</button>
                </form>
            </div>

            <div class="card">
                <h2><i class="fa-solid fa-scroll"></i> Kết Quả Luận Giải</h2>
                <div class="result-box" id="analysis-result-content">
                    <p style="color: #a0aec0;">Chưa có kết quả luận giải. Vui lòng tải lá số lên để phân tích.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- TAB 2: TRÒ CHUYỆN AI -->
    <div class="tab-content" id="tab-1">
        <div class="card chat-container">
            <h2><i class="fa-solid fa-comments"></i> Trò Chuyện Cùng AI</h2>
            <div class="chat-messages" id="chat-messages">
                <div class="chat-bubble bot">Xin chào! Bạn có thể đặt câu hỏi chi tiết về lá số vừa được luận giải.</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" class="form-control" placeholder="Nhập câu hỏi về lá số...">
                <button class="btn-submit" style="width: auto; padding: 0 20px;" onclick="sendMessage()">Gửi</button>
            </div>
        </div>
    </div>

    <!-- TAB 3: KHO DỮ LIỆU SÁCH -->
    <div class="tab-content" id="tab-2">
        <div class="card">
            <h2><i class="fa-solid fa-book"></i> Dữ Liệu Phú & Sách Trong Cache</h2>
            <div class="metric-card">
                <span style="color: var(--text-muted); font-size: 0.85rem;">Dung lượng Cache</span>
                <h3 id="cache-size-display" style="color: var(--accent-color);">0 KB</h3>
            </div>
            <ul class="book-list" id="book-list-container"></ul>
        </div>
    </div>

    <script>
        // 1. Khởi tạo Streamlit Component
        const Streamlit = window.Streamlit;

        function setFrameHeight() {
            Streamlit.setFrameHeight(document.body.scrollHeight || 900);
        }

        // 2. Nhận dữ liệu truyền từ Python về HTML
        Streamlit.events.addEventListener(Streamlit.RENDER_EVENT, (event) => {
            const data = event.detail.args;

            if (data) {
                // Hiển thị kết quả luận giải
                if (data.analysis_result) {
                    document.getElementById('analysis-result-content').innerHTML = data.analysis_result;
                }

                // Render dữ liệu sách
                if (data.books_titles) {
                    document.getElementById('cache-size-display').innerText = data.books_size || "0 KB";
                    const bookContainer = document.getElementById('book-list-container');
                    bookContainer.innerHTML = "";
                    if (data.books_titles.length > 0) {
                        data.books_titles.forEach(title => {
                            const li = document.createElement('li');
                            li.innerText = title;
                            bookContainer.appendChild(li);
                        });
                    } else {
                        bookContainer.innerHTML = '<li style="color: var(--text-muted);">Chưa có dữ liệu sách hoặc tệp JSON đang trống.</li>';
                    }
                }

                // Render lịch sử Chat
                if (data.chat_history) {
                    const chatContainer = document.getElementById('chat-messages');
                    chatContainer.innerHTML = '<div class="chat-bubble bot">Xin chào! Bạn có thể đặt câu hỏi chi tiết về lá số vừa được luận giải.</div>';
                    data.chat_history.forEach(([userMsg, aiMsg]) => {
                        appendMessage(userMsg, 'user');
                        appendMessage(aiMsg, 'bot');
                    });
                }
            }

            setFrameHeight();
        });

        // 3. Hàm gửi dữ liệu từ JS sang Python
        function sendToStreamlit(payload) {
            Streamlit.setComponentValue(payload);
        }

        // Switch Tab
        function switchTab(index) {
            const tabs = document.querySelectorAll('.tab-btn');
            const contents = document.querySelectorAll('.tab-content');
            tabs.forEach((tab, i) => {
                tab.classList.toggle('active', i === index);
                contents[i].classList.toggle('active', i === index);
            });
            setFrameHeight();
        }

        // Sự kiện gửi Form Luận Giải
        document.getElementById("analysis-form").addEventListener("submit", function(e) {
            e.preventDefault();

            const fileInput = document.getElementById("file-input");
            const year = document.getElementById("year-input").value;
            const note = document.getElementById("note-input").value;

            if (fileInput.files.length === 0) {
                alert("Vui lòng chọn ảnh lá số!");
                return;
            }

            const btn = document.getElementById("btn-analyze");
            btn.innerText = "⚡ ĐANG XỬ LÝ AI...";
            btn.disabled = true;

            const reader = new FileReader();
            reader.onload = function(e) {
                sendToStreamlit({
                    action: "ANALYZE",
                    image_base64: e.target.result,
                    year: year,
                    note: note
                });
            };
            reader.readAsDataURL(fileInput.files[0]);
        });

        // Chat Helper
        function appendMessage(text, sender) {
            const chatContainer = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.className = `chat-bubble ${sender}`;
            div.innerText = text;
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }

        function sendMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (text) {
                appendMessage(text, 'user');
                sendToStreamlit({
                    action: "CHAT",
                    message: text
                });
                input.value = '';
            }
        }
    </script>
</body>
</html>
